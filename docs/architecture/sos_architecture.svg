<svg width="100%" viewBox="0 0 680 778" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Safe or Scam — C4 container diagram with cross-service communication</title>
<desc>A C4-style container diagram. The frontend calls the Spring Boot backend and FastAPI game engine over REST /api/v1 with JWT, and fetches images from the AI pipeline. Backend and game engine exchange a bidirectional internal REST API under /api/internal: backend reads progress and play-logs from the game engine, and the game engine pushes game-completed events to the backend. Backend owns PostgreSQL and Redis; game engine and AI pipeline share MongoDB; AI pipeline serves image files and calls Google Gemini and RSS feeds. Includes a cross-service communication matrix and data ownership section.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
text{font-family:"Anthropic Sans",-apple-system,"Segoe UI",sans-serif}
.t{font-size:14px;fill:#1f1e1d}
.th{font-size:14px;font-weight:500;fill:#1f1e1d}
.ts{font-size:12px;fill:#5f5e5a}
.box{fill:#f7f6f1;stroke:#dcd9cf}
.c-teal&gt;rect,rect.c-teal{fill:#e1f5ee;stroke:#0f6e56}
.c-teal .th,.c-teal .t{fill:#085041}.c-teal .ts{fill:#0f6e56}
.c-purple&gt;rect,rect.c-purple{fill:#eeedfe;stroke:#534ab7}
.c-purple .th,.c-purple .t{fill:#3c3489}.c-purple .ts{fill:#534ab7}
.c-coral&gt;rect,rect.c-coral{fill:#faece7;stroke:#993c1d}
.c-coral .th,.c-coral .t{fill:#712b13}.c-coral .ts{fill:#993c1d}
.c-blue&gt;rect,rect.c-blue{fill:#e6f1fb;stroke:#185fa5}
.c-blue .th,.c-blue .t{fill:#0c447c}.c-blue .ts{fill:#185fa5}
.c-green&gt;rect,rect.c-green{fill:#eaf3de;stroke:#3b6d11}
.c-green .th,.c-green .t{fill:#27500a}.c-green .ts{fill:#3b6d11}
.c-gray&gt;rect,rect.c-gray{fill:#f1efe8;stroke:#5f5e5a}
.c-gray .th,.c-gray .t{fill:#2c2c2a}.c-gray .ts{fill:#5f5e5a}
</style>
</defs>

<g class="c-gray"><rect x="440" y="32" width="200" height="66" rx="8" style="stroke-width:0.5px;stroke-dasharray:5 3"/>
<text class="th" x="452" y="54">External systems</text>
<text class="ts" x="452" y="74">Google Gemini · litellm</text>
<text class="ts" x="452" y="90">RSS / news feeds</text></g>

<g class="c-gray"><rect x="40" y="40" width="120" height="44" rx="8" style="stroke-width:0.5px"/>
<text class="th" x="52" y="60">User</text>
<text class="ts" x="52" y="76">web browser</text></g>

<line x1="100" y1="84" x2="100" y2="148" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="100" y="118" text-anchor="middle">uses · HTTPS</text>

<text class="th" x="40" y="144">Client</text>
<g class="c-blue"><rect x="40" y="150" width="400" height="48" rx="8" style="stroke-width:0.5px"/>
<text class="th" x="52" y="174">Frontend — React + Vite SPA</text>
<text class="ts" x="52" y="190">axios · TanStack Query · Zustand · React Router · :5173</text></g>

<line x1="600" y1="98" x2="600" y2="234" stroke="#d85a30" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="592" y="170" text-anchor="end">litellm · crawl</text>

<text class="th" x="40" y="230">Services</text>
<g class="c-teal"><rect x="40" y="236" width="160" height="124" rx="8" style="stroke-width:0.5px"/>
<text class="th" x="52" y="257">Backend API</text>
<text class="ts" x="52" y="276">Spring Boot · :8080</text>
<text class="ts" x="52" y="293">Security · JWT</text>
<text class="ts" x="52" y="310">Data JPA · Redis</text>
<text class="ts" x="52" y="327">Mail · Flyway</text>
<text class="ts" x="52" y="344">auth · users · stats</text></g>

<g class="c-purple"><rect x="300" y="236" width="140" height="124" rx="8" style="stroke-width:0.5px"/>
<text class="th" x="312" y="257">Game engine</text>
<text class="ts" x="312" y="276">FastAPI · :8000</text>
<text class="ts" x="312" y="293">State machine</text>
<text class="ts" x="312" y="310">Scoring · logs</text>
<text class="ts" x="312" y="327">Endings, progress</text>
<text class="ts" x="312" y="344">PyJWT · httpx</text></g>

<g class="c-coral"><rect x="460" y="236" width="180" height="124" rx="8" style="stroke-width:0.5px"/>
<text class="th" x="472" y="257">AI pipeline</text>
<text class="ts" x="472" y="276">Python · FastAPI :8001</text>
<text class="ts" x="472" y="293">Crawl · extract · dedup</text>
<text class="ts" x="472" y="310">Gemini via litellm</text>
<text class="ts" x="472" y="327">scikit-learn · slowapi</text>
<text class="ts" x="472" y="344">Scenario + image gen</text></g>

<line x1="120" y1="198" x2="120" y2="234" stroke="#378add" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="370" y1="198" x2="370" y2="234" stroke="#378add" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="420" y1="198" x2="548" y2="234" stroke="#378add" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="120" y="220" text-anchor="middle">/api/v1/* · JWT</text>
<text class="ts" x="370" y="220" text-anchor="middle">/api/v1/* · JWT</text>
<text class="ts" x="503" y="214" text-anchor="middle">/api/v1/images</text>

<line x1="200" y1="282" x2="298" y2="282" stroke="#1d9e75" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300" y1="316" x2="202" y2="316" stroke="#7f77dd" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="250" y="274" text-anchor="middle">reads gameplay</text>
<text class="ts" x="250" y="332" text-anchor="middle">pushes results</text>

<text class="th" x="40" y="380">Data stores</text>
<g class="c-green"><rect x="40" y="384" width="140" height="56" rx="8" style="stroke-width:0.5px"/>
<line x1="46" y1="396" x2="174" y2="396" stroke="#3b6d11" stroke-width="0.5"/>
<text class="th" x="52" y="414">PostgreSQL</text>
<text class="ts" x="52" y="431">users · stats</text></g>
<g class="c-green"><rect x="196" y="384" width="110" height="56" rx="8" style="stroke-width:0.5px"/>
<line x1="202" y1="396" x2="300" y2="396" stroke="#3b6d11" stroke-width="0.5"/>
<text class="th" x="208" y="414">Redis</text>
<text class="ts" x="208" y="431">verify codes</text></g>
<g class="c-green"><rect x="322" y="384" width="160" height="56" rx="8" style="stroke-width:0.5px"/>
<line x1="328" y1="396" x2="476" y2="396" stroke="#3b6d11" stroke-width="0.5"/>
<text class="th" x="334" y="414">MongoDB</text>
<text class="ts" x="334" y="431">scenarios · play</text></g>
<g class="c-green"><rect x="498" y="384" width="142" height="56" rx="8" style="stroke-width:0.5px"/>
<line x1="504" y1="396" x2="634" y2="396" stroke="#3b6d11" stroke-width="0.5"/>
<text class="th" x="510" y="414">Image files</text>
<text class="ts" x="510" y="431">static PNGs</text></g>

<line x1="110" y1="360" x2="110" y2="382" stroke="#1d9e75" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="190" y1="360" x2="245" y2="382" stroke="#1d9e75" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="370" y1="360" x2="395" y2="382" stroke="#7f77dd" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="360" x2="455" y2="382" stroke="#d85a30" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="569" y1="360" x2="569" y2="382" stroke="#d85a30" stroke-width="1.5" marker-end="url(#arrow)"/>

<text class="th" x="40" y="466">Cross-service communication</text>
<rect class="box" x="40" y="472" width="600" height="134" rx="8" style="stroke-width:0.5px"/>
<circle cx="56" cy="490" r="4" fill="#378add"/>
<text class="ts" x="68" y="494">Frontend → Backend &amp; Game engine — REST /api/v1/* · JWT (Bearer)</text>
<circle cx="56" cy="512" r="4" fill="#1d9e75"/>
<text class="ts" x="68" y="516">Backend ⇄ Game engine — internal REST /api/internal/* · X-Internal-Api-Key</text>
<text class="ts" x="82" y="536">↳ Backend GET /progress · /play-logs · /stats/phishing-breakdown</text>
<text class="ts" x="82" y="556">↳ Game POST /stats/game-completed  (push · idempotent)</text>
<circle cx="56" cy="574" r="4" fill="#d85a30"/>
<text class="ts" x="68" y="578">AI pipeline ⇄ MongoDB — writes scenarios; Game engine reads them (shared DB)</text>
<circle cx="56" cy="596" r="4" fill="#888780"/>
<text class="ts" x="68" y="600">AI → Gemini (litellm) · crawls RSS · no async broker (RabbitMQ unwired)</text>

<text class="th" x="40" y="632">Data ownership</text>
<rect class="box" x="40" y="638" width="600" height="74" rx="8" style="stroke-width:0.5px"/>
<circle cx="56" cy="658" r="4" fill="#1d9e75"/>
<text class="ts" x="68" y="662">Backend → PostgreSQL + Redis — users, stats, achievements, auth, email-verify</text>
<circle cx="56" cy="680" r="4" fill="#7f77dd"/>
<text class="ts" x="68" y="684">Game engine → MongoDB — game sessions, play-logs, scenario progress</text>
<circle cx="56" cy="702" r="4" fill="#d85a30"/>
<text class="ts" x="68" y="706">AI pipeline → MongoDB + image files — generated scenarios &amp; PNG assets</text>

<rect class="c-teal" x="40" y="732" width="11" height="11" rx="2" style="stroke-width:0.5px"/>
<text class="ts" x="56" y="741">Java · Spring</text>
<rect class="c-purple" x="150" y="732" width="11" height="11" rx="2" style="stroke-width:0.5px"/>
<text class="ts" x="166" y="741">game engine</text>
<rect class="c-coral" x="270" y="732" width="11" height="11" rx="2" style="stroke-width:0.5px"/>
<text class="ts" x="286" y="741">AI (Python)</text>
<rect class="c-blue" x="378" y="732" width="11" height="11" rx="2" style="stroke-width:0.5px"/>
<text class="ts" x="394" y="741">frontend</text>
<rect class="c-green" x="468" y="732" width="11" height="11" rx="2" style="stroke-width:0.5px"/>
<text class="ts" x="484" y="741">datastore</text>
<rect class="c-gray" x="566" y="732" width="11" height="11" rx="2" style="stroke-width:0.5px;stroke-dasharray:3 2"/>
<text class="ts" x="582" y="741">external</text>
<text class="ts" x="40" y="762">⇄ = bidirectional internal API  ·  dashed = external system  ·  all public paths under /api/v1</text>
</svg>
