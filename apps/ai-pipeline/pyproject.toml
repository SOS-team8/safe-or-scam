[project]
name = "ai-pipeline"
version = "0.1.0"
description = "Safe-or-Scam AI Pipeline (automated scenario generation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "litellm>=1.50.0",
    "google-genai>=0.8.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "slowapi>=0.1.9",
    "trafilatura>=1.12.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "motor>=3.3.0",
    "beanie>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mongomock-motor>=0.0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
