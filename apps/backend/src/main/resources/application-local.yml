spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:sos_db}
    username: ${POSTGRES_USER:sos_user}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:local-jwt-secret-key-at-least-32-bytes-123}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

auth:
  verification-token:
    secret: ${VERIFICATION_TOKEN_SECRET:local-verification-token-secret-at-least-32b}
    expires-in-seconds: 300
