name: CI - Game Engine

on:
  push:
    paths:
      - 'apps/game-engine/**'
  pull_request:
    paths:
      - 'apps/game-engine/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
        working-directory: apps/game-engine

      - name: Check syntax
        run: |
          python -m py_compile main.py
        working-directory: apps/game-engine