name: CI - Game Engine

on:
  push:
    paths:
      - 'apps/game-engine/**'
      - '.github/workflows/ci-game-engine.yml'
  pull_request:
    paths:
      - 'apps/game-engine/**'
      - '.github/workflows/ci-game-engine.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/game-engine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check syntax (compile all .py)
        run: uv run python -m compileall -q app

      - name: Import smoke test
        run: uv run python -c "from app.main import app; assert app is not None"
